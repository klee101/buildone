<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reconstruction</title>
<style>
  html,body,canvas { width:100%; height:100%; margin:0; display:block; overflow:hidden }
  body { background:radial-gradient(ellipse at 48% 42%,#faf9f7,#e4e6e7); font:16px system-ui }
  canvas { outline:none; touch-action:none }
  #error { position:absolute; inset:45% 8% auto; text-align:center; color:#373a3b }
</style>
<canvas tabindex="0" aria-label="3D reconstruction. Drag to orbit, middle drag to pan, scroll to zoom. Right drag to look, hold right and WASD or QE to fly. F to frame."></canvas>
<div id="error" role="alert" hidden></div>
<script type="module">
const parts = /*MESHES*/[];
const canvas = document.querySelector('canvas');
try {
  const gl = canvas.getContext('webgl2', {alpha:true, antialias:true});
  if (!gl) throw Error('Enable WebGL 2 in your browser to view the reconstruction.');
  function shader(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(shader));
    return shader;
  }
  const program = gl.createProgram();
  gl.attachShader(program,shader(gl.VERTEX_SHADER,`#version 300 es
    layout(location=0) in vec3 position;
    layout(location=1) in vec3 normal;
    uniform vec3 eye, rightAxis, upAxis, forward, projection;
    out vec3 n, toEye;
    void main() {
      vec3 delta = position-eye;
      float z = dot(delta,forward);
      gl_Position = vec4(dot(delta,rightAxis)*projection.x, dot(delta,upAxis)*projection.y,
                         z - 2.0*projection.z, z);
      n = normal;
      toEye = -delta;
    }`));
  gl.attachShader(program,shader(gl.FRAGMENT_SHADER,`#version 300 es
    precision highp float;
    in vec3 n, toEye;
    uniform vec3 color;
    out vec4 pixel;
    void main() {
      vec3 eyeDir = normalize(toEye), N = normalize(n);
      if (dot(N,eyeDir)<0.0) N = -N;
      vec3 L = normalize(vec3(-0.45,-0.65,1.0));
      float diffuse = 0.42 + 0.58*max(dot(N,L),0.0) + 0.12*max(N.z,0.0);
      float spec = 0.13 * pow(max(dot(N,normalize(eyeDir+L)),0.0),40.0);
      vec3 linear = pow(color,vec3(2.2))*diffuse + spec;
      pixel = vec4(pow(clamp(linear,0.0,1.0),vec3(1.0/2.2)),1.0);
    }`));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program,gl.LINK_STATUS)) throw Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  const uniforms = Object.fromEntries(['eye','rightAxis','upAxis','forward','projection','color']
    .map(k => [k,gl.getUniformLocation(program,k)]));
  function bytes(base64) {
    return Uint8Array.from(atob(base64), ch => ch.charCodeAt(0));
  }
  function buffer(target, data) {
    gl.bindBuffer(target,gl.createBuffer());
    gl.bufferData(target,data,gl.STATIC_DRAW);
  }
  const meshes = parts.map(part => {
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    buffer(gl.ARRAY_BUFFER,bytes(part.vertices));
    for (let i=0; i<2; i++) {
      gl.enableVertexAttribArray(i);
      gl.vertexAttribPointer(i,3,gl.FLOAT,false,24,i*12);
    }
    const indices = bytes(part.indices);
    buffer(gl.ELEMENT_ARRAY_BUFFER,indices);
    return {vao,count:indices.length/4,rgb:part.rgb};
  });
  const low = [0,1,2].map(i => Math.min(...parts.map(p => p.low[i])));
  const high = [0,1,2].map(i => Math.max(...parts.map(p => p.high[i])));
  const radius = Math.hypot(...high.map((v,i) => (v-low[i])/2));
  const add = (p,v,s) => p.map((n,i) => n+s*v[i]);
  const focal = 1/Math.tan(Math.PI/8);
  let yaw,pitch,distance,pivot, drag=null, lastX,lastY, frame=0, previous=0;
  const keys = new Set();
  function fit() {
    pivot = low.map((v,i) => (v+high[i])/2);
    yaw = -.37;
    pitch = -.18;
    distance = 1.08*radius*Math.hypot(1,focal/Math.min(1,canvas.clientWidth/canvas.clientHeight));
    invalidate();
  }
  function axes() {
    const s=Math.sin(yaw), c=Math.cos(yaw), t=Math.sin(pitch), h=Math.cos(pitch);
    return {right:[c,-s,0], up:[-s*t,-c*t,h], forward:[s*h,c*h,t]};
  }
  function render(now) {
    frame=0;
    const dt = Math.min((now-previous)/1000,0.05);
    previous=now;
    const {right,up,forward} = axes();
    if (drag==='look' && keys.size) {
      const speed = dt*radius*(keys.has('ShiftLeft')||keys.has('ShiftRight') ? 4 : 1.4);
      const axis = (plus,minus) => Number(keys.has(plus))-Number(keys.has(minus));
      pivot=add(pivot,forward,speed*axis('KeyW','KeyS'));
      pivot=add(pivot,right,speed*axis('KeyD','KeyA'));
      pivot[2]+=speed*axis('KeyE','KeyQ');
      invalidate();
    }
    const ratio=Math.min(devicePixelRatio,2);
    const w=Math.max(1,Math.round(canvas.clientWidth*ratio)), h=Math.max(1,Math.round(canvas.clientHeight*ratio));
    if (canvas.width!==w || canvas.height!==h) { canvas.width=w; canvas.height=h }
    gl.viewport(0,0,w,h);
    gl.enable(gl.DEPTH_TEST);
    gl.clearColor(0,0,0,0);
    gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.uniform3fv(uniforms.eye,add(pivot,forward,-distance));
    gl.uniform3fv(uniforms.rightAxis,right);
    gl.uniform3fv(uniforms.upAxis,up);
    gl.uniform3fv(uniforms.forward,forward);
    gl.uniform3f(uniforms.projection,focal*h/w,focal,radius*0.001);
    for (const m of meshes) {
      gl.bindVertexArray(m.vao);
      gl.uniform3fv(uniforms.color,m.rgb);
      gl.drawElements(gl.TRIANGLES,m.count,gl.UNSIGNED_INT,0);
    }
  }
  function invalidate() { if (!frame) frame=requestAnimationFrame(render) }
  function zoom(amount) {
    distance = Math.max(radius*0.02,Math.min(radius*100,distance*Math.exp(amount)));
  }
  canvas.oncontextmenu = e => e.preventDefault();
  canvas.onpointerdown = e => {
    if (!e.isPrimary) return;
    canvas.focus();
    canvas.setPointerCapture(e.pointerId);
    drag = e.button===1 ? 'pan' : e.button===2 ? (e.altKey ? 'dolly' : 'look') : 'orbit';
    lastX=e.clientX; lastY=e.clientY;
    e.preventDefault();
  };
  canvas.onpointermove = e => {
    if (!drag || !e.isPrimary) return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    lastX=e.clientX; lastY=e.clientY;
    const {right,up,forward}=axes();
    if (drag==='pan') {
      const scale=2*distance/(focal*canvas.clientHeight);
      pivot=add(add(pivot,right,-dx*scale),up,dy*scale);
    } else if (drag==='dolly') {
      zoom(dy*0.01);
    } else {
      const eye=add(pivot,forward,-distance);
      yaw+=dx*0.006;
      pitch=Math.max(-1.55,Math.min(1.55,pitch + (drag==='look' ? -dy : dy)*0.006));
      if (drag==='look') pivot=add(eye,axes().forward,distance);
    }
    invalidate();
  };
  function release() { drag=null; keys.clear() }
  canvas.onlostpointercapture=release;
  window.addEventListener('blur',release);
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    zoom(Math.sign(e.deltaY)*Math.min(0.36,Math.abs(e.deltaY)*(e.deltaMode ? .06 : .0015)));
    invalidate();
  }, {passive:false});
  window.addEventListener('keydown',e => {
    if (e.code==='KeyF') fit();
    else if (drag==='look' && ['KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE','ShiftLeft','ShiftRight'].includes(e.code)) {
      e.preventDefault(); keys.add(e.code); invalidate();
    }
  });
  window.addEventListener('keyup',e => keys.delete(e.code));
  canvas.ondblclick=fit;
  window.addEventListener('resize',invalidate);
  fit();
} catch (err) {
  const message=document.querySelector('#error');
  message.textContent=err.message;
  message.hidden=false;
}
</script>
</html>
